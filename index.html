<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Planilha de Fichas Tempo</title>
<style>
:root {
  --bg: #ffffff; --surface: #f3f2f1; --line: #d9d6d3; --fg: #353535; --fg-soft: #67635f;
  --accent: #f29a25; --accent-ink: #2a2a2a; --danger: #b3361f; --ok: #2b7a4b;
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #3b3b3b; --surface: #484848; --line: #5c5c5c; --fg: #f5f3f0; --fg-soft: #bdb9b4;
    --accent: #f5a233; --danger: #ff9783; --ok: #86d6a5; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--font); }
.band { height: 6px; background: var(--accent); }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font-size: 26px; line-height: 1.2; }
p { margin: 0; }
.status { font-weight: 600; }
.status.erro { color: var(--danger); }
.status.ok { color: var(--ok); }
.btn { align-self: flex-start; min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent);
  color: var(--accent-ink); font: 600 15px/1 var(--font); cursor: pointer; }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.tabela { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-soft); }
tr:last-child td { border-bottom: 0; }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nota { color: var(--fg-soft); font-size: 13px; }
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<main>
  <h1>Planilha de Fichas Tempo</h1>
  <p class="status" id="status" role="status">Montando a planilha…</p>
  <button type="button" class="btn" id="baixar" hidden>Baixar de novo</button>
  <div class="tabela" id="tabela" hidden>
    <table>
      <thead><tr><th>Data</th><th>Início</th><th>Fim</th><th>Horas</th><th>Pasta</th><th>Tipo de serviço</th><th>Descrição</th><th>Solicitante</th></tr></thead>
      <tbody id="linhas"></tbody>
    </table>
  </div>
  <p class="nota">Importe o arquivo no AdvWin+ pelo módulo Ficha-Tempo, na seta para cima. As fichas vêm do link aberto pelo Cronômetro de Horas e ficam só neste navegador: nada é enviado a nenhum servidor.</p>
</main>

<script>
(function () {
  'use strict';
  var PRIMEIRA = 3, ULTIMA = 100, FOLHA = 'xl/worksheets/sheet1.xml';
  var statusEl = document.getElementById('status'), baixarEl = document.getElementById('baixar');

  function pad(n) { return String(n).padStart(2, '0'); }
  function hhmm(min) { return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
  function br(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function erro(msg) { statusEl.className = 'status erro'; statusEl.textContent = msg; }

  /* Link: #v1=<base64url do JSON {a, s, u, f:[[aaaa-mm-dd, inicioMin, fimMin, tipo, descricao, pasta, solicitante?], ...]}> */
  function lerLink() {
    var m = /^#v1=([A-Za-z0-9_-]+)$/.exec(location.hash);
    if (!m) return null;
    var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var d = JSON.parse(new TextDecoder().decode(bytes));
    if (!d || !Array.isArray(d.f) || !d.f.length) return null;
    d.f = d.f.filter(function (r) {
      return Array.isArray(r) && /^\d{4}-\d{2}-\d{2}$/.test(r[0]) && r[1] >= 0 && r[2] > r[1] && r[2] <= 1440;
    }).slice(0, ULTIMA - PRIMEIRA + 1);
    return d.f.length ? d : null;
  }

  function xml(s) {
    return String(s == null ? '' : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function txt(ref, s, estilo) {
    return '<c r="' + ref + '"' + (estilo ? ' s="' + estilo + '"' : '') + ' t="inlineStr"><is><t xml:space="preserve">' + xml(s) + '</t></is></c>';
  }
  function vazia(ref, estilo) { return '<c r="' + ref + '"' + (estilo ? ' s="' + estilo + '"' : '') + '/>'; }
  function serial(ymd) { var p = ymd.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000 + 25569; }
  function linhaXml(r, f, g, celulaS) {
    var ini = f[1] / 1440, fim = f[2] / 1440, dur = (f[2] - f[1]) / 1440;
    return '<row r="' + r + '" spans="1:20">' +
      '<c r="A' + r + '" s="1"><v>' + serial(f[0]) + '</v></c>' +
      vazia('C' + r) +
      txt('D' + r, g.a, 2) +
      '<c r="E' + r + '" s="4"><f>J' + r + '-I' + r + '</f><v>' + dur + '</v></c>' +
      '<c r="F' + r + '" s="4"><f>J' + r + '-I' + r + '</f><v>' + dur + '</v></c>' +
      txt('G' + r, f[3], 2) +
      txt('H' + r, f[4]) +
      '<c r="I' + r + '" s="3"><v>' + ini + '</v></c>' +
      '<c r="J' + r + '" s="3"><v>' + fim + '</v></c>' +
      vazia('K' + r, 5) + vazia('L' + r, 5) +
      (g.u ? txt('M' + r, g.u) : vazia('M' + r)) +
      (g.s ? txt('N' + r, g.s, 2) : vazia('N' + r, 2)) +
      vazia('O' + r, 2) +
      vazia('P' + r) + (f[6] ? txt('Q' + r, f[6]) : vazia('Q' + r)) +
      txt('R' + r, f[5], 6) +
      (celulaS || txt('S' + r, 'Ficha-Tempo')) +
      '</row>';
  }
  async function montar(d) {
    var zip = await JSZip.loadAsync(MODELO_FT_B64, { base64: true });
    var folha = await zip.file(FOLHA).async('string');
    d.f.forEach(function (f, i) {
      var r = PRIMEIRA + i, re = new RegExp('<row r="' + r + '"[^>]*>[\\s\\S]*?</row>');
      folha = folha.replace(re, function (orig) {
        var s = new RegExp('<c r="S' + r + '"[^>]*?(?:/>|>[\\s\\S]*?</c>)').exec(orig);
        return linhaXml(r, f, d, s ? s[0] : '');
      });
    });
    folha = folha.replace(/<selection activeCell="[^"]*" sqref="[^"]*"\/>/, '<selection activeCell="A3" sqref="A3"/>');
    zip.file(FOLHA, folha);
    return zip.generateAsync({ type: 'blob', compression: 'DEFLATE',
      mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  function salvar() {
    if (!arquivo) return;
    var url = URL.createObjectURL(arquivo), a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }
  function tabela(d) {
    var tb = document.getElementById('linhas');
    d.f.forEach(function (f) {
      var tr = document.createElement('tr');
      [br(f[0]), hhmm(f[1]), hhmm(f[2]), hhmm(f[2] - f[1]), f[5], f[3], f[4], f[6] || ''].forEach(function (v, i) {
        var td = document.createElement('td'); td.textContent = v; if (i < 4) td.className = 'n'; tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    document.getElementById('tabela').hidden = false;
  }

  baixarEl.addEventListener('click', salvar);
  var d;
  try { d = lerLink(); } catch (e) { d = null; }
  /* Tira as fichas do endereço e do histórico do navegador depois de lidas. */
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  if (!d) { erro('Este link não traz fichas. Abra esta página pelo botão Gerar planilha do Cronômetro de Horas.'); return; }
  if (!window.JSZip) { erro('A biblioteca de planilhas não carregou. Verifique a conexão e abra o link de novo pelo cronômetro.'); return; }
  tabela(d);
  var hoje = new Date();
  nome = 'fichas-tempo-advwin-' + hoje.getFullYear() + '-' + pad(hoje.getMonth() + 1) + '-' + pad(hoje.getDate()) + '.xlsx';
  montar(d).then(function (blob) {
    arquivo = blob;
    salvar();
    statusEl.className = 'status ok';
    statusEl.textContent = (d.f.length === 1 ? 'Planilha com 1 ficha baixada.' : 'Planilha com ' + d.f.length + ' fichas baixada.') +
      ' Se o download não começou, use o botão abaixo.';
    baixarEl.hidden = false;
  }).catch(function (e) { erro('Não foi possível montar a planilha: ' + (e && e.message ? e.message : 'erro desconhecido') + '.'); });
})();
</script>
